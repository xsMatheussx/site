services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tz_store
      POSTGRES_USER: tz
      POSTGRES_PASSWORD: tz
    ports: ["5432:5432"]
    volumes: ["tz_postgres:/var/lib/postgresql/data"]
  redis:
    image: redis:8-alpine
    ports: ["6379:6379"]
volumes:
  tz_postgres:
